<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Réinitialisation du mot de passe</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            width: 350px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        .error {
            color: red;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Réinitialisation</h2>

        <div id="errorMessage" class="error"></div>

        <input type="password" id="newPassword" placeholder="Nouveau mot de passe" required />
        <input type="password" id="confirmPassword" placeholder="Confirmer mot de passe" required />
        <button onclick="submitForm()">Valider</button>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");

        async function submitForm() {
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const errorDiv = document.getElementById("errorMessage");

            errorDiv.innerText = "";

            const response = await fetch("/api/auth/reset", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    token: token,
                    newPassword: newPassword,
                    confirmPassword: confirmPassword
                })
            });

            const result = await response.json();

            if (response.ok) {
                window.location.href = "/reset-success.html";
            } else {
                errorDiv.innerText = result.message || "Erreur lors de la réinitialisation";
            }
        }
    </script>

</body>
</html>
