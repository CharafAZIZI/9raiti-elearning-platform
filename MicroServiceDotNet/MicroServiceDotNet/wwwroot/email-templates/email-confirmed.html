<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email confirmé</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f9;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            background: #ffffff;
            padding: 60px 50px;
            border-radius: 18px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.08);
            text-align: center;
            width: 420px;
        }

        .icon {
            font-size: 60px;
            color: #22c55e;
            margin-bottom: 20px;
        }

        h1 {
            color: #111827;
            margin-bottom: 15px;
            font-size: 22px;
        }

        p {
            color: #6b7280;
            font-size: 15px;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">✔</div>
        <h1>Email confirmé avec succès</h1>
        <p>
            Votre adresse email a été vérifiée avec succès.<br>
            Votre compte est maintenant activé.
        </p>
    </div>
</body>
</html>
