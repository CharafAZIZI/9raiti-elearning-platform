version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_db
    environment:
      ACCEPT_EULA: ""
      SA_PASSWORD: ""
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  minio:
    image: minio/minio
    container_name: minio_server
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  spring_app:
    build: .
    container_name: spring_app
    depends_on:
      - sqlserver
      - minio
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=GestionCours;encrypt=false;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: YourStrong!Pass123

      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin

    restart: always

  gateway:
    build: ./Gateway
    container_name: api_gateway
    ports:
      - "5000:5000"
    depends_on:
      - spring_app
    restart: always

volumes:
  sql_data:
  minio_data: