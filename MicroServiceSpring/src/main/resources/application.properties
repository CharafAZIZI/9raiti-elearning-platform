spring.application.name=MicroServiceSpring

# PORT
server.port=8080

# POSTGRESQL
spring.datasource.url=jdbc:postgresql://postgres:5432/GestionCours
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT - doit etre identique au dotnet-service
jwt.secret=${JWT_SECRET}
#Groq Api
groq.api.key=${GROQ_API_KEY}

# UPLOAD
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# MinIO
minio.url=http://minio-service:9000
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9002}
minio.access-key=minioadmin
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket=cours

# ===================== KAFKA =====================
# Overridable by env var SPRING_KAFKA_BOOTSTRAP_SERVERS in Docker
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

# Consumer
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Ne pas inclure le type Java dans les headers Kafka (consumer cross-service)
spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false