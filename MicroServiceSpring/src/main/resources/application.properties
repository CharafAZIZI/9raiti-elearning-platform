spring.application.name=MicroServiceSpring

# PORT
server.port=8080

# POSTGRESQL
spring.datasource.url=jdbc:postgresql://postgres:5432/GestionCours
spring.datasource.username=postgres
spring.datasource.password=REMOVED_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT ? doit être identique au dotnet-service
jwt.secret=REMOVED_JWT_SECRET

# UPLOAD
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# MinIO
minio.url=http://minio:9000
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9002}
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket=cours