spring.application.name=MicroServiceSpring

# PORT SPRING BOOT
server.port=8080

# SQL SERVER - AUTHENTIFICATION WINDOWS
spring.datasource.url=jdbc:sqlserver://db:1433;databaseName=GestionCours;encrypt=false;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Pas de username/password pour Windows Authentication
# spring.datasource.username=
# spring.datasource.password=

jwt.secret=REMOVED_JWT_SECRET

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# UPLOAD FILE
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# MinIO
minio.url=http://127.0.0.1:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket=cours