version: "3.9"
services:
  angular:
    build:
      context: ./9raiti
      dockerfile: Dockerfile
    container_name: angular
    ports:
      - "4200:80"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - elearning-net

  api-gateway:
    build:
      context: ./ApiGateway/ApiGateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "9000:9000"
    depends_on:
      dotnet-service:
        condition: service_started
      spring-service:
        condition: service_started
    networks:
      - elearning-net

  dotnet-service:
    build:
      context: ./MicroServiceDotNet/MicroServiceDotNet
      dockerfile: Dockerfile
    container_name: dotnet-service
    restart: on-failure   # ← Redémarre automatiquement si crash
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=GestionUtilisateurs;User Id=sa;Password=REMOVED_PASSWORD;TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy  # ← Attend que SQL Server soit VRAIMENT prêt
    networks:
      - elearning-net

  spring-service:
    build:
      context: ./MicroServiceSpring
      dockerfile: Dockerfile
    container_name: spring-service
    restart: on-failure   # ← Redémarre automatiquement si crash
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/GestionCours
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=REMOVED_PASSWORD
    depends_on:
      postgres:
        condition: service_healthy  # ← Attend que Postgres soit VRAIMENT prêt
    networks:
      - elearning-net

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "REMOVED_PASSWORD"
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "REMOVED_PASSWORD"
      MSSQL_AGENT_ENABLED: "false"
    ports:
      - "1434:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - elearning-net
    healthcheck:   # ← Vérifie que SQL Server est prêt
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "REMOVED_PASSWORD", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      - POSTGRES_DB=GestionCours
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=REMOVED_PASSWORD
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - elearning-net
    healthcheck:   # ← Vérifie que Postgres est prêt
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  elearning-net:
    driver: bridge

volumes:
  sqlserver-data:
  postgres-data: