<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>9raiti — Plateforme d'apprentissage</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          fontFamily: {
            display: ['"Playfair Display"', 'Georgia', 'serif'],
            body:    ['"DM Sans"', 'system-ui', 'sans-serif'],
          },
          animation: {
            'fade-in':    'fadeIn .4s ease forwards',
            'slide-up':   'slideUp .5s cubic-bezier(.16,1,.3,1) forwards',
            'slide-right':'slideRight .5s cubic-bezier(.16,1,.3,1) forwards',
            'scale-in':   'scaleIn .3s cubic-bezier(.16,1,.3,1) forwards',
            'float':      'float 4s ease-in-out infinite',
            'spin-slow':  'spin .9s linear infinite',
            'shimmer':    'shimmer 2s linear infinite',
            'pulse-soft': 'pulseSoft 2s ease-in-out infinite',
          },
          keyframes: {
            fadeIn:     {'0%':{opacity:'0'},                               '100%':{opacity:'1'}},
            slideUp:    {'0%':{opacity:'0',transform:'translateY(24px)'},  '100%':{opacity:'1',transform:'translateY(0)'}},
            slideRight: {'0%':{opacity:'0',transform:'translateX(-24px)'}, '100%':{opacity:'1',transform:'translateX(0)'}},
            scaleIn:    {'0%':{opacity:'0',transform:'scale(.95)'},         '100%':{opacity:'1',transform:'scale(1)'}},
            float:      {'0%,100%':{transform:'translateY(0)'},            '50%':{transform:'translateY(-8px)'}},
            shimmer:    {'0%':{'background-position':'-200% 0'},           '100%':{'background-position':'200% 0'}},
            pulseSoft:  {'0%,100%':{opacity:'1'},                          '50%':{opacity:'.5'}},
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ╔══════════════════════════════════════════════════════════╗
       ║   DESIGN TOKENS — définit TOUTES les variables CSS      ║
       ║   utilisées dans toute l'application                    ║
       ╚══════════════════════════════════════════════════════════╝ */

    /* ── DARK MODE (défaut) ─────────────────────────────────────── */
    :root,
    html[data-theme="dark"] {
      /* Backgrounds */
      --bg-base:       #090c13;
      --bg-surface:    #10141f;
      --bg-elevated:   #161b28;
      --bg-card-alt:   #13172200;
      --bg-hover:      rgba(255,255,255,.04);

      /* Borders */
      --border:        rgba(255,255,255,.07);
      --border-strong: rgba(255,255,255,.12);

      /* Text */
      --text-primary:   #f0f4ff;
      --text-secondary: #94a3b8;
      --text-muted:     #4a5568;
      --text-disabled:  #2d3748;

      /* Brand — or/ambre */
      --brand:        #e8a828;
      --brand-light:  #f4db9d;
      --brand-dim:    rgba(232,168,40,.12);
      --brand-bg:     rgba(232,168,40,.08);
      --brand-border: rgba(232,168,40,.25);
      --brand-glow:   rgba(232,168,40,.35);

      /* Info (bleu) */
      --info-bg:      rgba(59,130,246,.08);
      --info-color:   #60a5fa;

      /* States */
      --success-bg:    rgba(34,197,94,.1);
      --success-color: #4ade80;
      --success-border:rgba(34,197,94,.2);

      --error-bg:      rgba(239,68,68,.1);
      --error-color:   #f87171;
      --error-border:  rgba(239,68,68,.2);

      --warning-bg:    rgba(251,191,36,.1);
      --warning-color: #fbbf24;
      --warning-border:rgba(251,191,36,.2);

      /* Inputs */
      --input-bg:     rgba(255,255,255,.05);
      --input-border: rgba(255,255,255,.1);
      --input-focus:  rgba(232,168,40,.55);

      /* Shadows */
      --shadow-sm:    0 2px 8px rgba(0,0,0,.3);
      --shadow-md:    0 8px 24px rgba(0,0,0,.4);
      --shadow-lg:    0 20px 60px rgba(0,0,0,.55);
      --shadow-brand: 0 8px 24px rgba(232,168,40,.3);
    }

    /* ── LIGHT MODE ─────────────────────────────────────────────── */
    html[data-theme="light"] {
      --bg-base:       #f1f5fb;
      --bg-surface:    #ffffff;
      --bg-elevated:   #f7f9ff;
      --bg-card-alt:   #eef2fa;
      --bg-hover:      rgba(0,0,0,.03);

      --border:        rgba(0,0,0,.08);
      --border-strong: rgba(0,0,0,.14);

      --text-primary:   #0f172a;
      --text-secondary: #475569;
      --text-muted:     #94a3b8;
      --text-disabled:  #cbd5e1;

      --brand:        #c17d0a;
      --brand-light:  #e8a828;
      --brand-dim:    rgba(193,125,10,.1);
      --brand-bg:     rgba(193,125,10,.07);
      --brand-border: rgba(193,125,10,.25);
      --brand-glow:   rgba(193,125,10,.2);

      --info-bg:      rgba(59,130,246,.07);
      --info-color:   #3b82f6;

      --success-bg:    rgba(22,163,74,.08);
      --success-color: #16a34a;
      --success-border:rgba(22,163,74,.2);

      --error-bg:      rgba(220,38,38,.08);
      --error-color:   #dc2626;
      --error-border:  rgba(220,38,38,.2);

      --warning-bg:    rgba(217,119,6,.08);
      --warning-color: #d97706;
      --warning-border:rgba(217,119,6,.2);

      --input-bg:     #ffffff;
      --input-border: rgba(0,0,0,.12);
      --input-focus:  rgba(193,125,10,.5);

      --shadow-sm:    0 2px 8px rgba(0,0,0,.06);
      --shadow-md:    0 8px 24px rgba(0,0,0,.1);
      --shadow-lg:    0 20px 60px rgba(0,0,0,.15);
      --shadow-brand: 0 8px 24px rgba(193,125,10,.2);
    }

    /* ── BASE RESET ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      transition: background .3s ease, color .3s ease;
    }

    /* ── TYPOGRAPHY ─────────────────────────────────────────────── */
    .font-display { font-family: 'Playfair Display', Georgia, serif !important; }
    .text-gold {
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-light) 50%, var(--brand) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── SCROLLBAR ──────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--brand-border); border-radius: 10px; }

    /* ── GOOGLE BTN ─────────────────────────────────────────────── */
    #google-btn > div { width: 100% !important; }
    #google-btn iframe { width: 100% !important; }

    /* ══════════════════════════════════════════════════════════════
       COMPONENT CLASSES — utilisées dans les templates HTML
    ══════════════════════════════════════════════════════════════ */

    /* ── PAGE ────────────────────────────────────────────────────── */
    .page-bg {
      background: var(--bg-base);
      min-height: 100vh;
      color: var(--text-primary);
    }

    /* ── CARDS ───────────────────────────────────────────────────── */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      transition: transform .25s cubic-bezier(.16,1,.3,1), box-shadow .25s, border-color .2s;
    }
    .card-hover:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--border-strong);
    }

    /* ── INPUTS ──────────────────────────────────────────────────── */
    .input-base {
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      color: var(--text-primary);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      width: 100%;
      transition: border-color .2s, box-shadow .2s;
    }
    .input-base::placeholder { color: var(--text-muted); }
    .input-base:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px var(--brand-dim);
    }
    .input-base.error { border-color: var(--error-color) !important; }
    .input-icon { padding-left: 44px; }

    /* Select styling */
    select.input-base { cursor: pointer; }

    /* ── BUTTONS ─────────────────────────────────────────────────── */
    .btn-brand {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      background: linear-gradient(135deg, var(--brand), #b5720b);
      color: #fff; font-weight: 700; font-family: inherit;
      border: none; border-radius: 12px;
      padding: 13px 24px; font-size: 14px; cursor: pointer;
      transition: transform .2s, box-shadow .2s, opacity .2s;
      white-space: nowrap;
    }
    .btn-brand:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--shadow-brand); }
    .btn-brand:active { transform: translateY(0); }
    .btn-brand:disabled { opacity: .4; cursor: not-allowed; }

    .btn-ghost {
      display: inline-flex; align-items: center; gap: 8px;
      background: transparent;
      border: 1.5px solid var(--border-strong);
      color: var(--text-secondary); font-family: inherit;
      border-radius: 12px; padding: 10px 18px; font-size: 14px; font-weight: 500;
      cursor: pointer; transition: all .2s;
    }
    .btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }

    .btn-danger {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--error-bg);
      border: 1.5px solid var(--error-border);
      color: var(--error-color); font-family: inherit;
      border-radius: 12px; padding: 10px 18px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all .2s;
    }
    .btn-danger:hover:not(:disabled) { background: rgba(239,68,68,.18); }
    .btn-danger:disabled { opacity: .4; cursor: not-allowed; }

    /* ── BADGES ──────────────────────────────────────────────────── */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .4px;
    }
    .badge-brand   { background: var(--brand-dim);   color: var(--brand);         border: 1px solid var(--brand-border);   }
    .badge-success { background: var(--success-bg);  color: var(--success-color); border: 1px solid var(--success-border); }
    .badge-error   { background: var(--error-bg);    color: var(--error-color);   border: 1px solid var(--error-border);   }
    .badge-warning { background: var(--warning-bg);  color: var(--warning-color); border: 1px solid var(--warning-border); }
    .badge-blue    { background: var(--info-bg);     color: var(--info-color);    border: 1px solid rgba(59,130,246,.2);   }
    .badge-purple  { background: rgba(168,85,247,.1);color: #c084fc;              border: 1px solid rgba(168,85,247,.2);   }

    /* ── ALERTS ──────────────────────────────────────────────────── */
    .alert { display: flex; align-items: flex-start; gap: 10px; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
    .alert-success { background: var(--success-bg);  border: 1px solid var(--success-border); color: var(--success-color); }
    .alert-error   { background: var(--error-bg);    border: 1px solid var(--error-border);   color: var(--error-color);   }
    .alert-warning { background: var(--warning-bg);  border: 1px solid var(--warning-border); color: var(--warning-color); }

    /* ── NAVBAR ──────────────────────────────────────────────────── */
    .nav-bar {
      height: 64px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      position: sticky; top: 0; z-index: 50;
      transition: background .3s, border-color .3s;
    }

    /* ── AUTH PANELS ─────────────────────────────────────────────── */
    .auth-panel-left {
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
    }
    html[data-theme="dark"] .auth-panel-left {
      background: linear-gradient(145deg, #111520 0%, #090c13 100%);
    }
    .auth-grid-bg {
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* ── BANNERS ─────────────────────────────────────────────────── */
    .banner { position: relative; border-radius: 24px; overflow: hidden; padding: 32px; }
    .banner-top-line {
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--brand), transparent);
    }
    .banner-apprenant {
      background: var(--bg-surface);
      border: 1px solid var(--border);
    }
    html[data-theme="dark"] .banner-apprenant {
      background: linear-gradient(135deg, #12111a 0%, #0e1220 100%);
    }
    html[data-theme="light"] .banner-apprenant {
      background: linear-gradient(135deg, #fdf8ee 0%, #faefd0 100%);
      border-color: var(--brand-border);
    }
    .banner-enseignant {
      background: var(--bg-surface);
      border: 1px solid var(--border);
    }
    html[data-theme="dark"] .banner-enseignant {
      background: linear-gradient(135deg, #15120a 0%, #12100e 100%);
    }
    html[data-theme="light"] .banner-enseignant {
      background: linear-gradient(135deg, #fdf8ee 0%, #faefd0 100%);
      border-color: var(--brand-border);
    }

    /* ── TABLES ──────────────────────────────────────────────────── */
    .table-wrap { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    .table-wrap table { width: 100%; border-collapse: collapse; }
    .table-head { background: var(--bg-elevated); border-bottom: 1px solid var(--border); }
    .table-head th {
      color: var(--text-muted); font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .5px;
      padding: 12px 20px; text-align: left;
    }
    .table-row td { padding: 14px 20px; border-bottom: 1px solid var(--border); color: var(--text-secondary); font-size: 14px; }
    .table-row:last-child td { border-bottom: none; }
    .table-row:hover { background: var(--bg-hover); }

    /* ── PROGRESS ────────────────────────────────────────────────── */
    .progress-track { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .progress-fill  { height: 100%; border-radius: 99px; transition: width .8s cubic-bezier(.16,1,.3,1); }

    /* ── THEME TOGGLE ────────────────────────────────────────────── */
    .theme-toggle {
      width: 44px; height: 24px;
      background: var(--border-strong);
      border-radius: 99px; position: relative;
      cursor: pointer; border: none;
      transition: background .3s; flex-shrink: 0;
    }
    .theme-toggle.on { background: var(--brand); }
    .theme-toggle::after {
      content: '';
      position: absolute; top: 3px; left: 3px;
      width: 18px; height: 18px; border-radius: 50%;
      background: white;
      transition: transform .3s cubic-bezier(.16,1,.3,1), box-shadow .3s;
      box-shadow: 0 1px 4px rgba(0,0,0,.2);
    }
    .theme-toggle.on::after { transform: translateX(20px); }

    /* ── MODALS ──────────────────────────────────────────────────── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.6); backdrop-filter: blur(6px);
      z-index: 1000; display: flex; align-items: center; justify-content: center;
      animation: fadeIn .2s ease;
    }
    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: 24px; padding: 32px;
      max-width: 480px; width: 90%;
      animation: scaleIn .25s cubic-bezier(.16,1,.3,1);
      box-shadow: var(--shadow-lg);
    }

    /* ── SIDEBAR (admin / profile) ───────────────────────────────── */
    .sidebar-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-radius: 10px;
      border: 1px solid transparent;
      color: var(--text-secondary);
      font-size: 14px; font-weight: 500;
      cursor: pointer; transition: all .2s;
      background: transparent; width: 100%; text-align: left;
      font-family: inherit;
    }
    .sidebar-item:hover { background: var(--bg-hover); color: var(--text-primary); }
    .sidebar-item.active {
      background: var(--brand-dim);
      border-left: 2px solid var(--brand);
      border-color: var(--brand-border);
      color: var(--brand);
    }

    /* ── UTILITIES ───────────────────────────────────────────────── */
    .section-divider   { height: 1px; background: var(--border); }
    .section-divider-t { border-top: 1px solid var(--border); }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Stagger animation helpers */
    .delay-0 { animation-delay:   0ms; }
    .delay-1 { animation-delay:  80ms; }
    .delay-2 { animation-delay: 160ms; }
    .delay-3 { animation-delay: 240ms; }
    .delay-4 { animation-delay: 320ms; }
  </style>
</head>
<body>
  <app-root></app-root>
</body>
</html>
