<nav class="nav-bar h-16 flex items-center justify-between px-4 sm:px-6 sticky top-0 z-50">

  <!-- Brand -->
  <div class="flex items-center gap-3">
    <div class="w-9 h-9 rounded-xl flex items-center justify-center text-base font-bold flex-shrink-0"
         style="background: linear-gradient(135deg, var(--brand), #b5720b); box-shadow: 0 4px 12px var(--brand-glow); color: white;">
      📚
    </div>
    <span class="font-display font-bold text-lg" style="color: var(--text-primary);">9raiti</span>
    <span *ngIf="role === 'admin'" class="badge badge-purple text-xs">ADMIN</span>
  </div>

  <!-- Right section -->
  <div class="flex items-center gap-2 sm:gap-3">

    <!-- Theme Toggle -->
    <div class="flex items-center gap-2">
      <!-- Sun icon -->
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           class="transition-opacity" [style.opacity]="isDark ? '0.35' : '0.9'" style="color: var(--brand);">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <button class="theme-toggle" [class.on]="isDark" (click)="toggleTheme()" title="Changer le thème" aria-label="Toggle theme"></button>
      <!-- Moon icon -->
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           class="transition-opacity" [style.opacity]="isDark ? '0.9' : '0.35'" style="color: var(--brand);">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </div>

    <!-- Separator -->
    <div class="w-px h-6 hidden sm:block" style="background: var(--border-strong);"></div>

    <!-- User info (desktop) -->
    <div class="hidden sm:flex items-center gap-2.5">
      <button (click)="navigateToProfile()"
              class="flex items-center gap-2.5 rounded-xl px-3 py-1.5 transition-all duration-200"
              style="border: 1px solid transparent;"
              onmouseover="this.style.background='var(--bg-hover)'; this.style.borderColor='var(--border)';"
              onmouseout="this.style.background='transparent'; this.style.borderColor='transparent';">
        <!-- Avatar -->
        <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0"
             style="background: linear-gradient(135deg, var(--brand), #b5720b); color: white; box-shadow: 0 2px 8px var(--brand-glow);">
          {{ initials }}
        </div>
        <div class="leading-tight text-left">
          <div class="text-sm font-semibold" style="color: var(--text-primary);">{{ displayName }}</div>
          <div class="text-xs" style="color: var(--text-muted);">{{ email }}</div>
        </div>
      </button>
      <span class="badge"
            [class.badge-brand]="role === 'apprenant'"
            [class.badge-success]="role === 'enseignant'"
            [class.badge-purple]="role === 'admin'">
        {{ role }}
      </span>
    </div>

    <!-- Separator -->
    <div class="w-px h-6 hidden sm:block" style="background: var(--border-strong);"></div>

    <!-- Profile icon (mobile) -->
    <button (click)="navigateToProfile()" class="sm:hidden w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold"
            style="background: linear-gradient(135deg, var(--brand), #b5720b); color: white;">
      {{ initials }}
    </button>

    <!-- Logout -->
    <button (click)="logout()" [disabled]="logoutLoading"
            class="btn-danger flex items-center gap-1.5 px-3 py-2 text-sm"
            style="padding: 8px 14px;">
      <svg *ngIf="!logoutLoading" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
      </svg>
      <svg *ngIf="logoutLoading" class="animate-spin-slow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10" stroke-dasharray="20 60"/>
      </svg>
      <span class="hidden sm:inline font-medium">Déconnexion</span>
    </button>

  </div>
</nav>
