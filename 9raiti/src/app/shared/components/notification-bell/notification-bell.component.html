<div class="notif-wrapper" [class.open]="isOpen">

  <!-- Bouton cloche -->
  <button class="notif-bell" (click)="togglePanel()"
          [attr.aria-label]="'Notifications, ' + (unread$ | async) + ' non lues'">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         [class.shake]="(unread$ | async)! > 0">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
    <span *ngIf="(unread$ | async)! > 0" class="notif-badge">
      {{ (unread$ | async)! > 99 ? '99+' : (unread$ | async) }}
    </span>
  </button>

  <!-- Panel -->
  <div class="notif-panel" *ngIf="isOpen" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="notif-header">
      <div class="flex items-center gap-2">
        <span class="notif-title">Notifications</span>
        <span *ngIf="(unread$ | async)! > 0" class="notif-count">{{ unread$ | async }}</span>
        <span class="notif-dot" [class.connected]="connected$ | async"
              [title]="(connected$ | async) ? 'Temps réel actif' : 'Reconnexion...'"></span>
      </div>
      <div class="flex items-center gap-1">
        <button *ngIf="(unread$ | async)! > 0" class="btn-xs" (click)="markAllRead()">Tout lire</button>
        <button *ngIf="(notifs$ | async)!.length > 0" class="btn-xs danger" (click)="clearAll()">Effacer tout</button>
      </div>
    </div>

    <!-- Liste -->
    <div class="notif-list">
      <div *ngIf="(notifs$ | async)!.length === 0" class="notif-empty">
        <div class="notif-empty-icon">🔔</div>
        <p>Aucune notification pour l'instant</p>
      </div>

      <div *ngFor="let n of (notifs$ | async)" class="notif-item" [class.unread]="!n.lue" (click)="read(n.id)">
        <div class="notif-icon-wrap" [style.background]="getIconBg(n.type)">{{ getIcon(n.type) }}</div>
        <div class="notif-body">
          <p class="notif-msg">{{ n.message }}</p>
          <p class="notif-time">{{ n.timestamp | date:'HH:mm · dd/MM/yy' }}</p>
        </div>
        <div *ngIf="!n.lue" class="unread-dot"></div>
        <button class="btn-remove" (click)="remove(n.id); $event.stopPropagation()" title="Supprimer">×</button>
      </div>
    </div>

  </div>
</div>

<!-- Toast -->
<div class="toast-wrap" *ngIf="currentToast">
  <div class="toast-card">
    <div class="notif-icon-wrap" [style.background]="getIconBg(currentToast.type)">{{ getIcon(currentToast.type) }}</div>
    <p class="toast-msg">{{ currentToast.message }}</p>
    <button class="toast-close" (click)="dismissToast()">×</button>
  </div>
</div>
