  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          fontFamily: {
            display: ['"Syne"', 'sans-serif'],
            body:    ['"Plus Jakarta Sans"', 'sans-serif'],
            mono:    ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              DEFAULT: '#F59E0B',
              50:  '#FFFBEB',
              100: '#FEF3C7',
              200: '#FDE68A',
              300: '#FCD34D',
              400: '#FBBF24',
              500: '#F59E0B',
              600: '#D97706',
              700: '#B45309',
              800: '#92400E',
              900: '#78350F',
            },
            slate: {
              850: '#0f1623',
              950: '#080c14',
            }
          },
          backgroundImage: {
            'grid-pattern': "linear-gradient(rgba(245,158,11,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(245,158,11,.04) 1px,transparent 1px)",
            'radial-glow': 'radial-gradient(ellipse at center, rgba(245,158,11,0.15) 0%, transparent 65%)',
          },
          backgroundSize: {
            'grid': '40px 40px',
          },
          boxShadow: {
            'brand-sm': '0 2px 8px rgba(245,158,11,0.2)',
            'brand-md': '0 4px 24px rgba(245,158,11,0.25)',
            'brand-lg': '0 8px 40px rgba(245,158,11,0.3)',
            'glass':    '0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05)',
            'card':     '0 1px 3px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.3)',
            'card-hover': '0 4px 16px rgba(0,0,0,0.5), 0 16px 48px rgba(0,0,0,0.4)',
          },
          animation: {
            'fade-in':    'fadeIn .4s ease forwards',
            'slide-up':   'slideUp .5s cubic-bezier(.16,1,.3,1) forwards',
            'slide-right':'slideRight .5s cubic-bezier(.16,1,.3,1) forwards',
            'scale-in':   'scaleIn .3s cubic-bezier(.16,1,.3,1) forwards',
            'float':      'float 5s ease-in-out infinite',
            'spin-slow':  'spin .8s linear infinite',
            'shimmer':    'shimmer 2s linear infinite',
            'pulse-brand':'pulseBrand 2s ease-in-out infinite',
            'glow-pulse': 'glowPulse 3s ease-in-out infinite',
          },
          keyframes: {
            fadeIn:     {'0%':{opacity:'0'},                               '100%':{opacity:'1'}},
            slideUp:    {'0%':{opacity:'0',transform:'translateY(20px)'},  '100%':{opacity:'1',transform:'translateY(0)'}},
            slideRight: {'0%':{opacity:'0',transform:'translateX(-20px)'}, '100%':{opacity:'1',transform:'translateX(0)'}},
            scaleIn:    {'0%':{opacity:'0',transform:'scale(.96)'},         '100%':{opacity:'1',transform:'scale(1)'}},
            float:      {'0%,100%':{transform:'translateY(0)'},            '50%':{transform:'translateY(-10px)'}},
            shimmer:    {'0%':{'background-position':'-200% 0'},           '100%':{'background-position':'200% 0'}},
            pulseBrand: {'0%,100%':{'box-shadow':'0 0 0 0 rgba(245,158,11,0)'},  '50%':{'box-shadow':'0 0 0 8px rgba(245,158,11,0.15)'}},
            glowPulse:  {'0%,100%':{opacity:'.6'}, '50%':{opacity:'1'}},
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* ── CSS DESIGN TOKENS ──────────────────────────────────── */
    :root, html[data-theme="dark"] {
      --bg:           #080c14;
      --bg-2:         #0d1220;
      --bg-3:         #111827;
      --bg-4:         #1a2235;
      --surface:      #0f1623;
      --surface-2:    #141e2e;
      --border:       rgba(255,255,255,.06);
      --border-2:     rgba(255,255,255,.1);
      --border-brand: rgba(245,158,11,.3);
      --text:         #f1f5f9;
      --text-2:       #94a3b8;
      --text-3:       #475569;
      --text-4:       #2d3d52;
      --brand:        #F59E0B;
      --brand-2:      #FCD34D;
      --brand-dim:    rgba(245,158,11,.1);
      --brand-glow:   rgba(245,158,11,.25);
      --green:        #10b981;
      --green-dim:    rgba(16,185,129,.1);
      --blue:         #3b82f6;
      --blue-dim:     rgba(59,130,246,.1);
      --red:          #ef4444;
      --red-dim:      rgba(239,68,68,.1);
      --orange:       #f97316;
      --orange-dim:   rgba(249,115,22,.1);
      --purple:       #8b5cf6;
      --purple-dim:   rgba(139,92,246,.1);
      --error-color:  #ef4444;
      --success-color:#10b981;
      --warning-color:#f97316;
      --shadow:       0 1px 3px rgba(0,0,0,.5),0 4px 16px rgba(0,0,0,.4);
      --shadow-lg:    0 8px 40px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.4);
      --input-bg:     rgba(255,255,255,.04);
      --input-border: rgba(255,255,255,.08);
    }

    html[data-theme="light"] {
      --bg:        #f8fafc;
      --bg-2:      #f1f5f9;
      --bg-3:      #e2e8f0;
      --bg-4:      #cbd5e1;
      --surface:   #ffffff;
      --surface-2: #f8fafc;
      --border:    rgba(0,0,0,.06);
      --border-2:  rgba(0,0,0,.12);
      --border-brand: rgba(245,158,11,.35);
      --text:      #0f172a;
      --text-2:    #475569;
      --text-3:    #94a3b8;
      --text-4:    #cbd5e1;
      --brand:     #d97706;
      --brand-2:   #f59e0b;
      --brand-dim: rgba(217,119,6,.08);
      --brand-glow:rgba(217,119,6,.2);
      --green:        #059669;
      --green-dim:    rgba(5,150,105,.08);
      --blue:         #2563eb;
      --blue-dim:     rgba(37,99,235,.08);
      --red:          #dc2626;
      --red-dim:      rgba(220,38,38,.08);
      --orange:       #ea580c;
      --orange-dim:   rgba(234,88,12,.08);
      --purple:       #7c3aed;
      --purple-dim:   rgba(124,58,237,.08);
      --error-color:  #dc2626;
      --success-color:#059669;
      --warning-color:#ea580c;
      --shadow:    0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06);
      --shadow-lg: 0 8px 40px rgba(0,0,0,.1),0 2px 8px rgba(0,0,0,.07);
      --input-bg:     rgba(0,0,0,.03);
      --input-border: rgba(0,0,0,.1);
    }

    /* ── BASE ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      transition: background .35s, color .35s;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-brand); border-radius: 99px; }

    /* ── GLASS CARD ─────────────────────────────────────────── */
    .glass {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      transition: all .25s cubic-bezier(.16,1,.3,1);
    }
    .glass-hover:hover {
      border-color: var(--border-2);
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }
    .glass-brand {
      background: var(--surface);
      border: 1px solid var(--border-brand);
      border-radius: 16px;
    }

    /* ── INPUTS ─────────────────────────────────────────────── */
    .inp {
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      color: var(--text);
      border-radius: 12px;
      padding: 11px 16px;
      font-size: 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      outline: none;
      width: 100%;
      transition: border-color .2s, box-shadow .2s;
    }
    .inp::placeholder { color: var(--text-3); }
    .inp:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-dim);
    }
    .inp.err { border-color: var(--red) !important; }
    .inp-icon { padding-left: 42px; }

    /* ── BUTTONS ─────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600; border-radius: 12px;
      border: none; cursor: pointer;
      transition: all .2s; white-space: nowrap;
    }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-brand {
      background: linear-gradient(135deg, #F59E0B, #D97706);
      color: white; font-size: 14px; padding: 12px 22px;
    }
    .btn-brand:hover:not(:disabled) { box-shadow: 0 4px 20px var(--brand-glow); transform: translateY(-1px); }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border-2) !important;
      color: var(--text-2); font-size: 14px; padding: 10px 18px;
    }
    .btn-ghost:hover { background: var(--bg-3); color: var(--text); border-color: var(--border-brand) !important; }
    .btn-danger {
      background: var(--red-dim);
      border: 1px solid rgba(239,68,68,.2) !important;
      color: var(--red); font-size: 13px; padding: 8px 14px;
    }
    .btn-danger:hover:not(:disabled) { background: rgba(239,68,68,.18); }
    .btn-success {
      background: var(--green-dim);
      border: 1px solid rgba(16,185,129,.2) !important;
      color: var(--green); font-size: 13px; padding: 8px 14px;
    }
    .btn-success:hover:not(:disabled) { background: rgba(16,185,129,.18); }
    .btn-sm { padding: 7px 14px !important; font-size: 12px !important; border-radius: 9px !important; }

    /* ── BADGES ─────────────────────────────────────────────── */
    .badge {
      display: inline-flex; align-items: center;
      padding: 3px 10px; border-radius: 99px;
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .5px;
    }
    .b-brand   { background: var(--brand-dim);  color: var(--brand);  border: 1px solid var(--border-brand); }
    .b-green   { background: var(--green-dim);  color: var(--green);  border: 1px solid rgba(16,185,129,.2); }
    .b-blue    { background: var(--blue-dim);   color: var(--blue);   border: 1px solid rgba(59,130,246,.2);  }
    .b-red     { background: var(--red-dim);    color: var(--red);    border: 1px solid rgba(239,68,68,.2);   }
    .b-orange  { background: var(--orange-dim); color: var(--orange); border: 1px solid rgba(249,115,22,.2);  }
    .b-purple  { background: var(--purple-dim); color: var(--purple); border: 1px solid rgba(139,92,246,.2);  }

    /* ── ALERTS ─────────────────────────────────────────────── */
    .alert { display: flex; align-items: flex-start; gap: 10px; padding: 12px 16px; border-radius: 12px; font-size: 13.5px; line-height: 1.5; }
    .alert-green  { background: var(--green-dim);  border: 1px solid rgba(16,185,129,.2);  color: var(--green); }
    .alert-red    { background: var(--red-dim);    border: 1px solid rgba(239,68,68,.2);   color: var(--red);   }
    .alert-brand  { background: var(--brand-dim);  border: 1px solid var(--border-brand);  color: var(--brand); }
    .alert-orange { background: var(--orange-dim); border: 1px solid rgba(249,115,22,.2);  color: var(--orange);}

    /* ── PROGRESS ───────────────────────────────────────────── */
    .prog-track { height: 5px; background: var(--border-2); border-radius: 99px; overflow: hidden; }
    .prog-fill  { height: 100%; border-radius: 99px; transition: width .9s cubic-bezier(.16,1,.3,1); }

    /* ── TABLE ──────────────────────────────────────────────── */
    .tbl { width: 100%; border-collapse: collapse; }
    .tbl th { color: var(--text-3); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; padding: 12px 20px; text-align: left; background: var(--surface-2); border-bottom: 1px solid var(--border); }
    .tbl td { padding: 14px 20px; border-bottom: 1px solid var(--border); color: var(--text-2); font-size: 13.5px; }
    .tbl tr:last-child td { border-bottom: none; }
    .tbl-row:hover td { background: rgba(255,255,255,.02); }

    /* ── NAVBAR ─────────────────────────────────────────────── */
    .navbar {
      height: 64px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* ── SIDEBAR ITEM ───────────────────────────────────────── */
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 14px; border-radius: 10px;
      color: var(--text-2); font-size: 13.5px; font-weight: 500;
      cursor: pointer; transition: all .2s;
      border: 1px solid transparent;
      background: none; width: 100%; text-align: left;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .nav-item:hover { color: var(--text); background: var(--bg-3); }
    .nav-item.active {
      background: var(--brand-dim);
      border-color: var(--border-brand);
      color: var(--brand);
    }

    /* ── TOGGLE ─────────────────────────────────────────────── */
    .toggle {
      width: 40px; height: 22px;
      background: var(--bg-3);
      border-radius: 99px; position: relative;
      cursor: pointer; border: 1px solid var(--border-2);
      transition: background .3s;
    }
    .toggle.on { background: var(--brand); border-color: transparent; }
    .toggle::after {
      content: '';
      position: absolute; top: 2px; left: 2px;
      width: 16px; height: 16px; border-radius: 50%;
      background: white; transition: transform .25s cubic-bezier(.16,1,.3,1);
      box-shadow: 0 1px 4px rgba(0,0,0,.3);
    }
    .toggle.on::after { transform: translateX(18px); }

    /* ── MODAL ──────────────────────────────────────────────── */
/* ── MODAL ──────────────────────────────────────────────── */
.overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,.7); backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn .2s ease;
}
.modal {
  background: var(--surface);
  border: 1px solid var(--border-2);
  border-radius: 20px; padding: 28px;
  width: 90%; max-width: 440px;
  box-shadow: var(--shadow-lg);
  animation: scaleIn .25s cubic-bezier(.16,1,.3,1);
}
.modal-ia-box {
  background: var(--surface);
  border: 1px solid var(--border-2);
  border-radius: 20px; padding: 32px;
  width: 90%; max-width: 650px;
  max-height: 90vh; overflow-y: auto;
  box-shadow: var(--shadow-lg);
  animation: scaleIn .25s cubic-bezier(.16,1,.3,1);
  position: relative;
}
.modal-ia-box select,
.modal-ia-box input[type="number"],
.modal-ia-box input[type="text"] {
  background: var(--input-bg) !important;
  color: var(--text) !important;
  border-color: var(--input-border) !important;
}
.modal-ia-box select option {
  background: var(--surface) !important;
  color: var(--text) !important;
}
.modal-ia-box .ia-upload-zone {
  background: var(--bg-2) !important;
  border-color: var(--border-2) !important;
}
.modal-ia-box .ia-config-box {
  background: var(--bg-2) !important;
  border-color: var(--border) !important;
}
.modal-ia-box .ia-checkbox-card {
  background: var(--surface) !important;
  border-color: var(--border-2) !important;
}
.modal-ia-box .ia-subtitle {
  color: var(--text-3) !important;
}
.modal-ia-box .ia-title {
  color: var(--text) !important;
}
.modal-ia-box .ia-upload-title {
  color: var(--text) !important;
}
.modal-ia-box .ia-upload-subtitle {
  color: var(--text-3) !important;
}

/* ── FIX MODE CLAIR MODAL IA ── */
html[data-theme="light"] .modal-ia-box {
  background: #ffffff !important;
}
html[data-theme="light"] .modal-ia-box .ia-upload-zone {
  background: #f8fafc !important;
  border-color: #e2e8f0 !important;
}
html[data-theme="light"] .modal-ia-box .ia-config-box {
  background: #f8fafc !important;
  border-color: #e2e8f0 !important;
}
html[data-theme="light"] .modal-ia-box .ia-checkbox-card {
  background: #ffffff !important;
  border-color: #e2e8f0 !important;
}
html[data-theme="light"] .modal-ia-box select,
html[data-theme="light"] .modal-ia-box input[type="number"],
html[data-theme="light"] .modal-ia-box input[type="text"] {
  background: #ffffff !important;
  color: #0f172a !important;
  border-color: rgba(0,0,0,.1) !important;
}
html[data-theme="light"] .modal-ia-box .ia-title {
  color: #0f172a !important;
}
html[data-theme="light"] .modal-ia-box .ia-subtitle,
html[data-theme="light"] .modal-ia-box .ia-upload-subtitle {
  color: #64748b !important;
}
html[data-theme="light"] .modal-ia-box .ia-upload-title {
  color: #0f172a !important;
}

    /* ── DIVIDER ────────────────────────────────────────────── */
    .divider { height: 1px; background: var(--border); }
    .divider-v { width: 1px; background: var(--border-2); }

    /* ── AUTH GRID ──────────────────────────────────────────── */
    .auth-grid {
      background-image: linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);
      background-size: 36px 36px;
    }

    /* ── TEXT GRADIENT ──────────────────────────────────────── */
    .text-grad {
      background: linear-gradient(135deg, var(--brand), var(--brand-2) 60%, var(--brand) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    /* ── STAT CARD ACCENT ───────────────────────────────────── */
    .stat-accent {
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      border-radius: 16px 16px 0 0;
    }

    /* ── SCROLLBAR for tables ───────────────────────────────── */
    .scroll-x { overflow-x: auto; }

    /* ── DELAY UTILITIES ────────────────────────────────────── */
    .d-0 { animation-delay:   0ms; }
    .d-1 { animation-delay:  60ms; }
    .d-2 { animation-delay: 120ms; }
    .d-3 { animation-delay: 180ms; }
    .d-4 { animation-delay: 240ms; }

    /* ── LINE CLAMP ─────────────────────────────────────────── */
    .clamp-2 { display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden; }


    /* ================================================================
       RESPONSIVE DESIGN SYSTEM — 9raiti
       xs:0-479px | sm:480-767px | md:768-1023px | lg:1024px+
       ================================================================ */

    /* ── INPUTS — évite zoom iOS (font-size < 16px) ─────────────── */
    @media (max-width: 767px) {
      .inp { font-size: 16px !important; min-height: 44px; }
      select.inp { min-height: 44px; }
      .btn    { min-height: 40px; }
      .btn-sm { min-height: 34px; }
    }

    /* ── NAVBAR ──────────────────────────────────────────────────── */
    .navbar { height: 56px; }
    @media (min-width: 768px) { .navbar { height: 64px; } }

    /* ── BOTTOM NAV MOBILE ───────────────────────────────────────── */
    .mobile-nav {
      display: flex;
      position: fixed; bottom: 0; left: 0; right: 0;
      z-index: 90;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 6px 0 env(safe-area-inset-bottom, 8px);
    }
    @media (min-width: 768px) { .mobile-nav { display: none !important; } }
    .mobile-nav-item {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; gap: 2px; padding: 4px;
      font-size: 9px; font-weight: 600; color: var(--text-3);
      background: none; border: none; cursor: pointer;
      text-decoration: none; transition: color .2s;
    }
    .mobile-nav-item.active, .mobile-nav-item:hover { color: var(--brand); }
    .mobile-nav-icon { font-size: 20px; line-height: 1; }

    /* ── DASHBOARD LAYOUT ────────────────────────────────────────── */
    /* Réserve de l'espace en bas sur mobile pour la bottom-nav */
    @media (max-width: 767px) {
      .flex.h-\[calc\(100vh-64px\)\] { height: calc(100vh - 56px); }
      main.flex-1.overflow-y-auto { padding-bottom: 80px !important; }
    }
    /* Sidebar cachée sur mobile */
    @media (max-width: 767px) {
      aside.hidden.md\:flex { display: none !important; }
    }

    /* ── TABLES ──────────────────────────────────────────────────── */
    .scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    @media (max-width: 767px) {
      .tbl th { padding: 8px 12px; font-size: 10px; }
      .tbl td { padding: 10px 12px; font-size: 12.5px; }
    }

    /* ── MODALS — Bottom sheet mobile ────────────────────────────── */
    @media (max-width: 479px) {
      .overlay { align-items: flex-end !important; padding: 0 !important; }
      .modal {
        width: 100% !important; max-width: 100% !important;
        border-radius: 20px 20px 0 0 !important;
        padding: 22px 18px !important;
        padding-bottom: calc(22px + env(safe-area-inset-bottom, 0)) !important;
      }
      .modal-ia-box {
        width: 100% !important; max-width: 100% !important;
        border-radius: 20px 20px 0 0 !important;
        padding: 20px 14px !important;
        padding-bottom: calc(20px + env(safe-area-inset-bottom, 0)) !important;
        max-height: 88vh !important;
      }
    }
    @media (min-width: 480px) and (max-width: 767px) {
      .modal { max-width: 480px !important; }
      .modal-ia-box { max-width: 560px !important; }
    }

    /* ── HOME / LANDING ──────────────────────────────────────────── */
    @media (max-width: 479px) {
      /* Hero titre */
      #hero h1.font-display { font-size: 2.4rem !important; line-height: 1.18 !important; }
      #hero p.text-lg        { font-size: .95rem !important; }
      /* Stats : 2 cols */
      #hero .grid.grid-cols-2.md\:grid-cols-4 { gap: 10px !important; }
      #hero .grid.grid-cols-2.md\:grid-cols-4 > div { padding: 14px !important; }
      /* CTA buttons : colonne */
      #hero .flex.flex-wrap.gap-3 { flex-direction: column; }
      #hero .flex.flex-wrap.gap-3 .btn { width: 100%; justify-content: center; }
      /* Section titres */
      #catalogue h2, #about h2, #avis h2, #reclamation h2 {
        font-size: 2rem !important;
      }
      /* Footer */
      footer .grid { grid-template-columns: 1fr !important; gap: 28px !important; }
    }
    @media (min-width: 480px) and (max-width: 767px) {
      #hero h1.font-display { font-size: 2.9rem !important; }
    }
    /* Catalogue categories */
    @media (max-width: 479px) {
      #catalogue .grid.sm\:grid-cols-2.lg\:grid-cols-3 { grid-template-columns: 1fr !important; }
    }
    /* Avis : 2 cols sur tablette */
    @media (min-width: 640px) and (max-width: 1023px) {
      #avis .grid.sm\:grid-cols-2.lg\:grid-cols-4 { grid-template-columns: repeat(2,1fr) !important; }
    }
    /* Footer 2 cols tablette */
    @media (min-width: 480px) and (max-width: 1023px) {
      footer .grid.sm\:grid-cols-2.lg\:grid-cols-4 { grid-template-columns: repeat(2,1fr) !important; }
    }
    /* About section : masque la carte team sur mobile */
    @media (max-width: 1023px) {
      #about .grid.lg\:grid-cols-2 { grid-template-columns: 1fr !important; }
      #about .hidden.lg\:flex { display: none !important; }
    }
    /* Réclamation */
    @media (max-width: 1023px) {
      #reclamation .grid.lg\:grid-cols-2 { grid-template-columns: 1fr !important; }
    }

    /* ── AUTH PAGES ───────────────────────────────────────────────── */
    @media (max-width: 1023px) {
      /* Panel gauche caché sur tablette/mobile */
      .min-h-screen.flex > div.hidden.lg\:flex { display: none !important; }
    }

    /* ── CATEGORIES / MODULES / COURS ────────────────────────────── */
    @media (max-width: 479px) {
      /* 1 col */
      .grid.grid-cols-1.sm\:grid-cols-2.lg\:grid-cols-3.xl\:grid-cols-4 { grid-template-columns: 1fr !important; }
      .grid.grid-cols-1.sm\:grid-cols-2.lg\:grid-cols-3 { grid-template-columns: 1fr !important; }
      .grid.grid-cols-1.sm\:grid-cols-2.xl\:grid-cols-3 { grid-template-columns: 1fr !important; }
      /* Bannières cards */
      .h-28 { height: 68px !important; }
      /* Stats grids */
      .grid.grid-cols-2.sm\:grid-cols-4,
      .grid.grid-cols-2.lg\:grid-cols-4,
      .grid.grid-cols-2.lg\:grid-cols-5 { grid-template-columns: repeat(2,1fr) !important; gap: 10px !important; }
    }
    @media (min-width: 480px) and (max-width: 767px) {
      .grid.grid-cols-1.sm\:grid-cols-2.lg\:grid-cols-3.xl\:grid-cols-4 { grid-template-columns: repeat(2,1fr) !important; }
      .grid.grid-cols-1.sm\:grid-cols-2.lg\:grid-cols-3 { grid-template-columns: repeat(2,1fr) !important; }
    }
    /* Filtres statut : scroll horizontal */
    @media (max-width: 639px) {
      .flex.flex-wrap.gap-2 { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; scrollbar-width: none; }
      .flex.flex-wrap.gap-2::-webkit-scrollbar { display: none; }
      .flex.flex-wrap.gap-2 .btn-sm { flex-shrink: 0; }
    }

    /* ── COURS DETAIL ────────────────────────────────────────────── */
    @media (max-width: 639px) {
      iframe[title="Visualisation PDF"] { height: 60vh !important; min-height: 280px !important; }
      video { max-height: 52vh !important; }
    }

    /* ── DASHBOARD ADMIN / APPRENANT / ENSEIGNANT ────────────────── */
    @media (max-width: 639px) {
      /* Hero banner */
      .relative.overflow-hidden.rounded-2xl > .flex.flex-col.sm\:flex-row { flex-direction: column !important; }
      /* Filtres users */
      .glass.rounded-2xl.p-4 > .flex.flex-col.sm\:flex-row { flex-direction: column !important; }
      .glass.rounded-2xl.p-4 .inp[style*="max-width:165px"] { max-width: 100% !important; }
    }
    @media (max-width: 479px) {
      /* Stats 2 cols */
      .grid.grid-cols-2.lg\:grid-cols-5 { grid-template-columns: repeat(2,1fr) !important; }
      /* Stats 4 cols */
      .grid.grid-cols-2.sm\:grid-cols-4 { grid-template-columns: repeat(2,1fr) !important; }
      /* Content stats 4 cols */
      .grid.grid-cols-2.sm\:grid-cols-4.gap-3 { grid-template-columns: repeat(2,1fr) !important; }
      /* Content overview 3 cols */
      .grid.grid-cols-1.sm\:grid-cols-3 { grid-template-columns: 1fr !important; }
    }

    /* ── PROFILE ─────────────────────────────────────────────────── */
    @media (max-width: 1023px) {
      .grid.grid-cols-1.lg\:grid-cols-\[240px_1fr\] { grid-template-columns: 1fr !important; }
      .grid.grid-cols-1.lg\:grid-cols-\[220px_1fr\] { grid-template-columns: 1fr !important; }
    }
    @media (max-width: 479px) {
      /* Info form grid 2 cols → 1 col */
      .grid.grid-cols-1.sm\:grid-cols-2.gap-4 { grid-template-columns: 1fr !important; }
    }

    /* ── QUIZ RUNNER in dashboard (plein écran) ──────────────────── */
    @media (max-width: 639px) {
      .fixed.inset-0.z-50 .flex.items-center.justify-between.px-5 { padding: 10px 14px !important; }
      .fixed.inset-0.z-50 .w-full.max-w-2xl { padding: 16px 12px 80px !important; }
    }

    /* ── QUIZ APPRENANT / ENSEIGNANT pages dédiées ───────────────── */
    @media (max-width: 767px) {
      .quiz-layout { grid-template-columns: 1fr !important; }
      .cours-sidebar { position: static !important; top: unset !important; }
      .quiz-grid { grid-template-columns: 1fr !important; }
      .config-grid { grid-template-columns: 1fr !important; }
      .quiz-runner-header { flex-wrap: wrap; gap: 8px; }
      .question-runner { padding: 16px 12px 80px !important; }
      .resultats-container { padding: 16px 12px 80px !important; }
      .resultats-actions { flex-direction: column; }
      .resultats-actions button { width: 100%; }
      .quiz-apprenant-page,
      .quiz-enseignant-page { padding: 16px 12px 80px !important; }
      .page-header { flex-direction: column !important; align-items: flex-start !important; }
      .tab-bar { width: 100%; }
      .tab-btn { flex: 1; text-align: center; padding: 8px 6px !important; font-size: .78rem !important; }
      .modal-overlay { align-items: flex-end !important; padding: 0 !important; }
      .modal-box { border-radius: 16px 16px 0 0 !important; max-height: 88vh !important; }
    }
    @media (max-width: 479px) {
      .nav-btn { width: 30px !important; height: 30px !important; font-size: .78rem !important; }
      .score-grand { font-size: 3.5rem !important; }
      .detail-label { min-width: 120px !important; }
      .quiz-runner-overlay .question-card { padding: 16px !important; }
    }

    /* ── SAFE AREA ───────────────────────────────────────────────── */
    @supports (padding-top: env(safe-area-inset-top)) {
      .navbar {
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }
    }

    /* ── PREFERS REDUCED MOTION ──────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ── CLAMP UTILITIES ─────────────────────────────────────────── */
    .clamp-1 { display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden; }
    .clamp-2 { display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden; }
    .clamp-3 { display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden; }

    /* Google btn full width */
    #google-btn > div, #google-btn iframe { width: 100% !important; }
  </style>
